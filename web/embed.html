<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字人</title>
<style>
    html, body { margin: 0; padding: 0; background: #111; height: 100%; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #status { position: absolute; top: 8px; right: 10px; font: 12px/1.4 system-ui, sans-serif;
              color: #888; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 10px; }
    #status.on { color: #6f6; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<span id="status">连接中...</span>
<script>
let pc = null;
let sessionid = null;
let retryTimer = null;

function setStatus(ok, msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = ok ? 'on' : '';
}

function start() {
    if (pc) return;
    setStatus(false, '连接中...');
    const config = { sdpSemantics: 'unified-plan', iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    pc = new RTCPeerConnection(config);
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    pc.addEventListener('track', evt => {
        // 视频轨道 → 显示数字人画面
        if (evt.track.kind === 'video') document.getElementById('video').srcObject = evt.streams[0];
        // 音频轨道刻意不播放：s2s 页面本身会播放 TTS 声音，
        // 此处再放一遍会造成声音重复两遍。
    });
    pc.addEventListener('connectionstatechange', () => {
        if (pc.connectionState === 'connected') {
            setStatus(true, '已连接');
            if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
            setStatus(false, '连接断开，重连中...');
            stop();
            retryTimer = setTimeout(start, 3000);
        }
    });
    pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() =>
        new Promise(resolve => {
            if (pc.iceGatheringState === 'complete') resolve();
            else {
                const check = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', check); resolve(); } };
                pc.addEventListener('icegatheringstatechange', check);
            }
        })
    ).then(() => {
        const offer = pc.localDescription;
        return fetch('/offer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sdp: offer.sdp, type: offer.type, avatar: 'myavatar' }),
        });
    }).then(res => res.json()).then(answer => {
        if (answer.code && answer.code !== 0) throw new Error(answer.msg || 'server error');
        if (!answer.sdp) throw new Error('no sdp');
        if (answer.sessionid) { sessionid = answer.sessionid; parent.postMessage({ type: 'lt-session', sessionid }, '*'); }
        return pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answer.sdp }));
    }).catch(e => {
        setStatus(false, '连接失败: ' + (e.message || e));
        stop();
        retryTimer = setTimeout(start, 5000);
    });
}

function stop() {
    if (pc) { pc.close(); pc = null; }
}

start();
</script>
</body>
</html>
