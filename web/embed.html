<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字人</title>
<style>
    html, body { margin: 0; padding: 0; background: #111; height: 100%; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #status { position: absolute; top: 8px; right: 10px; font: 12px/1.4 system-ui, sans-serif;
              color: #888; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 10px; }
    #status.on { color: #6f6; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<audio id="audio" autoplay></audio>
<span id="status">连接中...</span>
<script>
let pc = null;
let sessionid = null;
let retryTimer = null;
const avatarId = new URLSearchParams(window.location.search).get('avatar') || 'jimeng_dark_girl';
const ICE_GATHER_TIMEOUT_MS = 3000;

function setStatus(ok, msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = ok ? 'on' : '';
}

function start() {
    if (pc) return;
    setStatus(false, '连接中...');
    const config = { sdpSemantics: 'unified-plan', iceServers: [{ urls: 'stun:stun.freeswitch.org:3478' }] };
    const connection = new RTCPeerConnection(config);
    pc = connection;
    connection.addTransceiver('video', { direction: 'recvonly' });
    connection.addTransceiver('audio', { direction: 'recvonly' });
    connection.addEventListener('track', evt => {
        const stream = evt.streams[0] || new MediaStream([evt.track]);
        if (evt.track.kind === 'video') {
            const v = document.getElementById('video');
            v.srcObject = stream;
            v.play().catch(err => console.warn('Video autoplay blocked:', err));
        } else {
            const a = document.getElementById('audio');
            a.srcObject = stream;
            a.muted = false;
            a.play().catch(err => console.warn('Audio autoplay blocked:', err));
        }
    });
    connection.addEventListener('connectionstatechange', () => {
        if (connection.connectionState === 'connected') {
            setStatus(true, '已连接');
            if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        } else if (['failed', 'disconnected', 'closed'].includes(connection.connectionState)) {
            if (pc !== connection) return;
            setStatus(false, '连接断开，重连中...');
            stop(connection);
            retryTimer = setTimeout(start, 3000);
        }
    });
    connection.createOffer().then(offer => connection.setLocalDescription(offer)).then(() =>
        new Promise(resolve => {
            if (connection.iceGatheringState === 'complete') return resolve();
            const finish = () => {
                clearTimeout(timeout);
                connection.removeEventListener('icegatheringstatechange', check);
                resolve();
            };
            const check = () => { if (connection.iceGatheringState === 'complete') finish(); };
            const timeout = setTimeout(finish, ICE_GATHER_TIMEOUT_MS);
            connection.addEventListener('icegatheringstatechange', check);
        })
    ).then(() => {
        if (pc !== connection) throw new Error('connection superseded');
        const offer = connection.localDescription;
        return fetch('/offer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sdp: offer.sdp, type: offer.type, avatar: avatarId }),
        });
    }).then(res => res.json()).then(answer => {
        if (pc !== connection) return;
        if (answer.code && answer.code !== 0) throw new Error(answer.msg || 'server error');
        if (!answer.sdp) throw new Error('no sdp');
        if (answer.sessionid) { sessionid = answer.sessionid; parent.postMessage({ type: 'lt-session', sessionid }, '*'); }
        return connection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answer.sdp }));
    }).catch(e => {
        if (pc !== connection) return;
        setStatus(false, '连接失败: ' + (e.message || e));
        stop(connection);
        retryTimer = setTimeout(start, 5000);
    });
}

function stop(connection = pc) {
    if (!connection) return;
    connection.close();
    if (pc === connection) {
        pc = null;
        sessionid = null;
    }
}

window.addEventListener('message', evt => {
    if (evt.data?.type === 'lt-session-request' && sessionid && evt.source) {
        evt.source.postMessage({ type: 'lt-session', sessionid }, '*');
    }
});

window.addEventListener('beforeunload', () => {
    if (retryTimer) clearTimeout(retryTimer);
    stop();
});

start();
</script>
</body>
</html>
